# Render Blueprint for OpenAisle (New > Blueprint > pick this repo).
# The web service uses an existing Render Postgres: set DATABASE_URL in the dashboard to that
# database's External URL. Keep the service in the same region as the database.
services:
  - type: web
    name: openaisle
    runtime: node
    region: singapore
    plan: free
    # devDependencies (prisma CLI, tailwind) are needed to build, so include them explicitly.
    # `npm run build` = prisma generate && next build.
    buildCommand: npm ci --include=dev && npm run build
    # next start listens on Render's $PORT.
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_TRANSACTION_SEARCH
        value: "false"
      # Secrets and environment-specific values: you are prompted for these on first deploy.
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false

# Alternative: let the Blueprint create and wire the database (Render's free tier allows one free
# Postgres per workspace, so remove the existing one first). Then replace the DATABASE_URL entry
# above with:
#
#       - key: DATABASE_URL
#         fromDatabase:
#           name: openaisle-db
#           property: connectionString
#
# databases:
#   - name: openaisle-db
#     databaseName: openaisle_db
#     plan: free
#     region: singapore
